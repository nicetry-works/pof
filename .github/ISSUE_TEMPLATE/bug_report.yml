name: Bug report
description: Something on the site is broken — a page 404s, a diagram doesn't render, the build fails.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected instead, if it's not obvious.
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page URL
      placeholder: https://pof.dev/format/roles
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
